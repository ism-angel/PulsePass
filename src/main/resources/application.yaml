spring:
  application:
    name: PulsePass
  datasource:
    url: jdbc:postgresql://localhost:5432/pulsepass
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: validate

pulsepass:
  security:
    jwt:
      issuer: ${PULSEPASS_JWT_ISSUER:pulsepass-api}
      secret-base64: ${PULSEPASS_JWT_SECRET_BASE64}
      access-token-ttl: PT15M